services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-backend-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - event-backend-network

  postgres:
    image: postgres:17-alpine
    container_name: event-backend-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test}
      POSTGRES_DB: ${DB_NAME:-event_backend}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-event_backend}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - event-backend-network

  redis:
    image: redis:7-alpine
    container_name: event-backend-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      sh -c 'if [ -n "$REDIS_PASS" ]; then
        redis-server --requirepass "$REDIS_PASS";
      else
        redis-server;
      fi'
    environment:
      REDIS_PASS: ${REDIS_PASS:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - event-backend-network

  minio:
    image: minio/minio:latest
    container_name: event-backend-minio
    restart: unless-stopped
    ports:
      - "${AWS_S3_PORT:-9000}:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - event-backend-network

  minio-setup:
    image: minio/mc:latest
    container_name: event-backend-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${AWS_S3_ACCESS_KEY:-minioadmin} ${AWS_S3_SECRET_KEY:-minioadmin};
        mc mb --ignore-existing local/${AWS_S3_BUCKET_NAME:-event-backend};
        mc anonymous set download local/${AWS_S3_BUCKET_NAME:-event-backend};
        exit 0;
      "
    env_file:
      - .env
    networks:
      - event-backend-network

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  event-backend-network:
    driver: bridge
