services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: production-event-backend-app
    restart: always
    ports:
      - "${APP_PORT:-8082}:8080"
    environment:
      APP_ENV: release
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - production-network

  postgres:
    image: postgres:17-alpine
    container_name: production-event-backend-postgres
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-event_backend}
    volumes:
      - production-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-event_backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.50"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - production-network

  redis:
    image: redis:7-alpine
    container_name: production-event-backend-redis
    restart: always
    expose:
      - "6379"
    command: >
      sh -c 'if [ -n "$REDIS_PASS" ]; then
        redis-server --requirepass "$REDIS_PASS" --maxmemory 200mb --maxmemory-policy allkeys-lru;
      else
        redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru;
      fi'
    environment:
      REDIS_PASS: ${REDIS_PASS:-}
    volumes:
      - production-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - production-network

  minio:
    image: minio/minio:latest
    container_name: production-event-backend-minio
    restart: always
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${AWS_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${AWS_S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - production-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - production-network

  minio-setup:
    image: minio/mc:latest
    container_name: production-event-backend-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${AWS_S3_ACCESS_KEY} ${AWS_S3_SECRET_KEY};
        mc mb --ignore-existing local/${AWS_S3_BUCKET_NAME:-event-backend};
        exit 0;
      "
    env_file:
      - .env.production
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"
    networks:
      - production-network

volumes:
  production-postgres-data:
  production-redis-data:
  production-minio-data:

networks:
  production-network:
    driver: bridge
