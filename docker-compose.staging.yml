services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staging-event-backend-app
    restart: always
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      APP_ENV: release
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - staging-network

  postgres:
    image: postgres:17-alpine
    container_name: staging-event-backend-postgres
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test}
      POSTGRES_DB: ${DB_NAME:-event_backend}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-event_backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  redis:
    image: redis:7-alpine
    container_name: staging-event-backend-redis
    restart: always
    expose:
      - "6379"
    command: >
      sh -c 'if [ -n "$REDIS_PASS" ]; then
        redis-server --requirepass "$REDIS_PASS";
      else
        redis-server;
      fi'
    environment:
      REDIS_PASS: ${REDIS_PASS:-}
    volumes:
      - staging-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  minio:
    image: minio/minio:latest
    container_name: staging-event-backend-minio
    restart: always
    expose:
      - "9000"
    ports:
      - "${MINIO_CONSOLE_PORT:-9002}:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - staging-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  minio-setup:
    image: minio/mc:latest
    container_name: staging-event-backend-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${AWS_S3_ACCESS_KEY:-minioadmin} ${AWS_S3_SECRET_KEY:-minioadmin};
        mc mb --ignore-existing local/${AWS_S3_BUCKET_NAME:-event-backend};
        mc anonymous set download local/${AWS_S3_BUCKET_NAME:-event-backend};
        exit 0;
      "
    env_file:
      - .env.staging
    networks:
      - staging-network

volumes:
  staging-postgres-data:
  staging-redis-data:
  staging-minio-data:

networks:
  staging-network:
    driver: bridge
