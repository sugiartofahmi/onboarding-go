version: "2"
linters:
  enable:
    - misspell
  disable:
    - cyclop
    - exhaustive
    - exhaustruct
    - funlen
    - gocognit
    - maintidx
    - varnamelen
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - event-backend
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
