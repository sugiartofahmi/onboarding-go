run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
  disable:
    - exhaustruct
    - exhaustive
    - wrapcheck
    - varnamelen
    - funlen
    - cyclop
    - gocognit
    - maintidx

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: event-backend
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 50
  max-same-issues: 10
